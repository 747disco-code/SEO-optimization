<style>
/* SEZIONE HERO - Stili */
.hero-747 {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 600px;
    overflow: hidden;
    background: linear-gradient(135deg, #833CA3 0%, #917F59 100%);
}

.hero-slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    opacity: 0;
    transition: opacity 1s ease-in-out;
    background-size: cover;
    background-position: center;
}

.hero-slide.active {
    opacity: 1;
}

.hero-slide::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(131, 60, 163, 0.5);
}

.hero-content {
    position: relative;
    z-index: 2;
    max-width: 800px;
    padding: 0 20px;
    color: white;
}

.hero-title {
    font-family: 'Mr Dafoe', cursive;
    font-size: 5rem;
    font-weight: 600;
    margin-bottom: 20px;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
}

.hero-subtitle {
    font-size: 1.3rem;
    font-weight: 400;
    text-transform: uppercase;
    margin-bottom: 30px;
    letter-spacing: 2px;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.7);
}

.hero-btn {
    display: inline-block;
    padding: 15px 40px;
    background: transparent;
    color: white;
    border: 2px solid white;
    text-decoration: none;
    text-transform: uppercase;
    font-weight: 600;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.hero-btn:hover {
    background: white;
    color: #833CA3;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
}

.slider-dots {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 15px;
    z-index: 10;
}

.dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
    cursor: pointer;
    transition: all 0.3s ease;
}

.dot.active {
    background: white;
    transform: scale(1.3);
}

/* Mobile */
@media (max-width: 768px) {
    .hero-title {
        font-size: 3rem;
    }
    .hero-subtitle {
        font-size: 1rem;
    }
    .hero-747 {
        height: 80vh;
    }
}
</style>

<!-- Hero Section HTML -->
<div class="hero-747">
    <!-- Slide 1 -->
    <div class="hero-slide active" style="background-image: url('https://747disco.it/wp-content/uploads/2022/12/IMG_5953-1200x800-1.jpg');">
        <div class="hero-content">
            <h1 class="hero-title">747 Disco</h1>
            <p class="hero-subtitle">Location per Feste ed Eventi a Roma</p>
            <a href="#contatti" class="hero-btn">Scopri di Più</a>
        </div>
    </div>
    
    <!-- Slide 2 -->
    <div class="hero-slide" style="background-image: url('https://747disco.it/wp-content/uploads/2022/12/Banner-02.jpg');">
        <div class="hero-content">
            <h2 class="hero-title">Gli Eventi</h2>
            <p class="hero-subtitle">La tua festa privata in grande stile</p>
            <a href="#eventi" class="hero-btn">Vedi Eventi</a>
        </div>
    </div>
    
    <!-- Slide 3 -->
    <div class="hero-slide" style="background-image: url('https://747disco.it/wp-content/uploads/2022/12/747-disco-contact.jpg');">
        <div class="hero-content">
            <h2 class="hero-title">La Location</h2>
            <p class="hero-subtitle">Completamente ristrutturata</p>
            <a href="#location" class="hero-btn">Dove Siamo</a>
        </div>
    </div>
    
    <!-- Navigation Dots -->
    <div class="slider-dots">
        <span class="dot active" data-slide="0"></span>
        <span class="dot" data-slide="1"></span>
        <span class="dot" data-slide="2"></span>
    </div>
</div>

<script>
// Slider JavaScript
(function() {
    const slides = document.querySelectorAll('.hero-slide');
    const dots = document.querySelectorAll('.dot');
    let currentSlide = 0;
    
    function showSlide(n) {
        slides.forEach(s => s.classList.remove('active'));
        dots.forEach(d => d.classList.remove('active'));
        
        if (n >= slides.length) currentSlide = 0;
        if (n < 0) currentSlide = slides.length - 1;
        
        slides[currentSlide].classList.add('active');
        dots[currentSlide].classList.add('active');
    }
    
    function nextSlide() {
        currentSlide++;
        showSlide(currentSlide);
    }
    
    // Auto slide every 5 seconds
    setInterval(nextSlide, 5000);
    
    // Dots click
    dots.forEach((dot, index) => {
        dot.addEventListener('click', () => {
            currentSlide = index;
            showSlide(currentSlide);
        });
    });
})();
</script>
